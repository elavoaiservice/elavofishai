<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — ElavoFishAI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1B33">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{--primary:#29ABE2;--primary-dark:#1882AE;--ink:#10233F;--muted:#5F708A;--border:#DCE7F5;--surface:#fff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:
      radial-gradient(1200px 600px at 50% -10%, #EAF6FF 0%, rgba(234,246,255,0) 60%),
      linear-gradient(180deg,#F8FBFF 0%,#EDF4FC 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
  .wrap{width:100%;max-width:420px}
  .brand{display:flex;align-items:center;justify-content:center;gap:11px;font-weight:800;font-size:20px;margin-bottom:22px;color:var(--ink);text-decoration:none}
  .brand img{height:40px;width:40px;border-radius:11px}
  .brand b{color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px 26px;
    box-shadow:0 18px 50px rgba(16,35,63,.10)}
  h1{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  .lede{color:var(--muted);font-size:.95rem;line-height:1.5;margin:0 0 20px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
  .snap{font-size:12px;color:var(--muted)}
  input{width:100%;min-height:46px;padding:0 13px;border:1px solid var(--border);border-radius:11px;
    background:#fff;color:var(--ink);font-size:1rem;font-family:inherit}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(41,171,226,.15)}
  .fld{margin-bottom:14px}
  .btn{width:100%;min-height:48px;border:none;border-radius:12px;background:var(--primary);color:#fff;
    font-weight:700;font-size:1rem;cursor:pointer;transition:.15s;margin-top:4px}
  .btn:hover{background:var(--primary-dark)}
  .btn:disabled{opacity:.6;cursor:default}
  #msg{font-size:.9rem;margin-top:14px;min-height:1.2em}
  #msg.ok{color:#1D6F42}#msg.err{color:#B3402C}
  #dev{margin-top:12px;font-size:.82rem;padding:11px 12px;background:#F2F7FF;border:1px solid var(--border);border-radius:10px}
  #dev a{word-break:break-all;color:var(--primary-dark)}
  .foot{text-align:center;margin-top:20px}
  .foot a{color:var(--muted);text-decoration:none;font-size:.88rem}
  .foot a:hover{color:var(--primary-dark)}
  .sent .fld,.sent .btn{display:none}
</style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/"><img src="/icon-512.png" alt="">Elavo<b>Fish</b>AI</a>
    <div class="card" id="card">
      <h1>Sign in</h1>
      <p class="lede">Enter your email and we'll send you a secure one-time sign-in link — no password to remember. New here? This creates your account.</p>
      <form id="form">
        <div class="fld"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
        <div class="fld"><label for="name">Name <span class="snap">(new accounts)</span></label><input id="name" autocomplete="name" placeholder="optional"></div>
        <button class="btn" id="send" type="submit">Send my sign-in link</button>
      </form>
      <div id="msg" aria-live="polite"></div>
      <div id="dev" hidden><span class="snap">Dev link — click to sign in:</span><br><a id="devLink" href="#"></a></div>
    </div>
    <div class="foot"><a href="/">← Back to home</a></div>
  </div>
<script>
  const $=id=>document.getElementById(id);
  $('form').addEventListener('submit', async function(e){
    e.preventDefault();
    const email=$('email').value.trim();
    const msg=$('msg');
    if(!email){ msg.className='err'; msg.textContent='Enter your email.'; return; }
    $('send').disabled=true; msg.className=''; msg.textContent='Sending…'; $('dev').hidden=true;
    try{
      const r=await fetch('/api/auth/request-link',{method:'POST',headers:{'Content-Type':'application/json'},
        credentials:'same-origin',body:JSON.stringify({email:email,displayName:$('name').value.trim()})});
      const d=await r.json();
      if(!r.ok){ msg.className='err'; msg.textContent=d.error||'That did not work.'; $('send').disabled=false; return; }
      msg.className='ok'; msg.textContent=d.message||'Check your email for your sign-in link.';
      $('card').classList.add('sent');
      if(d.devLink){ $('dev').hidden=false; const a=$('devLink'); a.textContent=d.devLink; a.href=d.devLink; }
    }catch(err){ msg.className='err'; msg.textContent='Server not reachable.'; $('send').disabled=false; }
  });
</script>
</body>
</html>
