<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — ElavoFishAI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{--primary:#29ABE2;--primary-dark:#1F96C8;--ink:#0f172a;--muted:#64748b;--border:#c8e6f7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#fff;color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:512px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:48px 24px}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:800;font-size:28px}
  .logo img{height:56px;width:56px;border-radius:14px}
  .logo b{color:var(--primary)}
  .card{margin-top:40px;width:100%;border:1px solid var(--border);border-radius:28px;background:#fff;padding:32px;box-shadow:0 18px 45px rgba(16,35,63,.10)}
  h1{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;text-align:center;margin:0 0 10px}
  .sub{text-align:center;color:var(--muted);font-size:.92rem;line-height:1.6;margin:0 0 24px}
  label{display:block;font-size:.87rem;font-weight:600;color:#334155;margin:0 0 7px}
  input{width:100%;min-height:48px;padding:0 14px;border:1px solid #cbd5e1;border-radius:12px;font-size:1rem;font-family:inherit;color:var(--ink)}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(41,171,226,.16)}
  .btn{width:100%;min-height:50px;margin-top:18px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--primary-dark)}
  .btn:disabled{opacity:.6;cursor:default}
  #msg{font-size:.88rem;margin-top:14px;text-align:center;min-height:1.1em}
  #msg.err{color:#b3402c}
  .alt{margin-top:22px;text-align:center;font-size:.9rem;color:var(--muted)}
  .alt a{color:var(--primary-dark);font-weight:600;text-decoration:none}
  .alt a:hover{text-decoration:underline}
  .home{display:block;text-align:center;margin-top:20px;font-size:.85rem;color:var(--muted);text-decoration:none}
  .home:hover{color:var(--primary-dark)}
  /* success state */
  .sent{display:none;text-align:center}
  .sent .ic{width:52px;height:52px;border-radius:50%;background:#e0f4fc;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px}
  .sent h3{font-size:1.15rem;font-weight:700;margin:0 0 8px}
  .sent p{color:var(--muted);font-size:.9rem;line-height:1.6;margin:0}
  #dev{margin-top:14px;font-size:.8rem;padding:11px 12px;background:#f1f7fd;border:1px solid var(--border);border-radius:10px;word-break:break-all}
  #dev a{color:var(--primary-dark)}
  .on-sent .form-view{display:none}
  .on-sent .sent{display:block}
</style>
</head>
<body>
  <div class="wrap">
    <a class="logo" href="/"><img src="/icon-512.png" alt="">Elavo<b>Fish</b>AI</a>
    <div class="card" id="card">
      <div class="form-view">
        <h1>Sign in to ElavoFishAI</h1>
        <p class="sub">Use your email to receive a secure one-time link. No passwords to remember.</p>
        <form id="form">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <button class="btn" id="send" type="submit">Email me a sign-in link</button>
        </form>
        <div id="msg"></div>
        <div class="alt">New to ElavoFishAI? <a href="/signup">Create an account</a></div>
      </div>
      <div class="sent">
        <div class="ic">📬</div>
        <h3>Check your email</h3>
        <p>We sent a sign-in link to <strong id="sentTo"></strong>.<br>It's good for 15 minutes.</p>
        <div id="dev" hidden><span>Dev link — tap to sign in:</span><br><a id="devLink" href="#"></a></div>
      </div>
    </div>
    <a class="home" href="/">← Back to home</a>
    <p style="margin:14px 0 0;font-size:12px;color:var(--muted);text-align:center">
      <a href="/terms.html" style="color:var(--muted)">Terms</a> ·
      <a href="/privacy.html" style="color:var(--muted)">Privacy</a></p>
  </div>
<script>
  // A used or expired link lands here with the reason in the query string.
  // It used to be sent to /app, which has no session and bounced to this page
  // without it, so an expired link looked like nothing had happened at all.
  (function(){
    const err=new URLSearchParams(location.search).get('auth_error');
    if(!err)return;
    const box=document.getElementById('msg')||document.getElementById('loginMsg');
    if(box){ box.className='err'; box.textContent=err; }
  })();
  const $=id=>document.getElementById(id);
  $('form').addEventListener('submit', async function(e){
    e.preventDefault();
    const email=$('email').value.trim(), msg=$('msg');
    if(!email){ msg.className='err'; msg.textContent='Enter your email.'; return; }
    $('send').disabled=true; msg.className=''; msg.textContent='Sending…';
    try{
      const r=await fetch('/api/auth/request-link',{method:'POST',headers:{'Content-Type':'application/json'},
        credentials:'same-origin',body:JSON.stringify({email})});
      const d=await r.json();
      if(!r.ok){ msg.className='err'; msg.textContent=d.error||'That did not work.'; $('send').disabled=false; return; }
      $('sentTo').textContent=email;
      $('card').classList.add('on-sent');
      if(d.devLink){ $('dev').hidden=false; const a=$('devLink'); a.textContent=d.devLink; a.href=d.devLink; }
    }catch(err){ msg.className='err'; msg.textContent='Server not reachable.'; $('send').disabled=false; }
  });
</script>
</body>
</html>
