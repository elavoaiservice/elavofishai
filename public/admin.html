<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElavoFishAI — Command Center</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--primary:#29ABE2;--primary-hover:#1F96C8;--primary-dark:#1882AE;--ink:#10233F;--muted:#5F708A;--border:#E5E7EB;--bg:#F9FAFB;--surface:#FFFFFF;--sky:#EAF6FF;--bull:#16A34A;--bear:#DC2626;--navy:#0B1B33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#111827;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary-hover)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;border-radius:9px;padding:9px 15px;cursor:pointer;border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:#fff;border-color:var(--border);color:#111827}.btn-ghost:hover{background:var(--sky)}
.btn-danger{background:#fff;border-color:#f3c6c6;color:var(--bear)}.btn-danger:hover{background:#fdeaea}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
input,select{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:#fff;color:#111827;width:100%}
input:focus,select:focus{outline:none;border-color:var(--primary)}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 8px 22px rgba(16,35,63,.05)}
.muted{color:var(--muted)}.snap{font-size:12px;color:var(--muted)}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0 0 12px}
.msg{font-size:13px;margin-top:8px}.msg.ok{color:var(--bull)}.msg.err{color:var(--bear)}
.hidden{display:none!important}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand img{height:34px;width:34px;border-radius:9px}
/* shell */
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cbd7e6;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{color:#fff;padding:6px 8px 14px}
.side .brand img{border-radius:9px}
.grp{margin-bottom:6px}
.grp-h{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;color:#7f93ad;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:9px 10px 5px;cursor:pointer}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:#cbd7e6;font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:8px;cursor:pointer}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.active{background:var(--primary);color:#fff}
.side .out{margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.main{padding:26px 30px 60px;overflow:auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.metric .n{font-size:28px;font-weight:800;letter-spacing:-.02em}
.metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-top:2px}
.metric .s{font-size:11px;color:var(--muted);margin-top:6px}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
/* changelog */
.cl-day{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.cl-day:first-child{margin-top:0}
.cl-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.cl-main{min-width:0;flex:1}
.cl-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cl-sum{margin-top:6px;font-size:14px;color:#111827;overflow-wrap:anywhere}
.cl-side{flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cl-sha{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#c3ccd8}
.cl-more{background:none;border:none;padding:0;margin-top:6px;font-size:11px;font-weight:600;color:var(--primary);cursor:pointer}
.cl-body{margin-top:8px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.55;color:var(--muted)}
.t-feat{background:#e7f6ee;color:#127a4b}.t-fix{background:#fdeaea;color:#b3261e}.t-perf{background:#fff4e5;color:#b7791f}
.t-refactor{background:#e8f4fd;color:#1F96C8}.t-docs{background:#f0ebfd;color:#6d4bd8}.t-test{background:#e6f6f5;color:#0f766e}
.t-build,.t-ci,.t-chore,.t-style,.t-other,.t-revert{background:#eef1f5;color:#5f708a}
.pill.active{background:#e7f6ee;color:var(--bull)}.pill.suspended{background:#fdeaea;color:var(--bear)}
.pill.ok{background:#e7f6ee;color:var(--bull)}.pill.down{background:#fdeaea;color:var(--bear)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.feed div{padding:9px 4px;border-bottom:1px solid var(--border);font-size:13.5px;display:flex;gap:10px;align-items:baseline}
.feed .tm{color:var(--muted);font-size:11px;min-width:120px}
pre{background:#0B1B33;color:#dbeafe;border-radius:12px;padding:14px;font-size:12px;overflow:auto;max-height:52vh;white-space:pre-wrap}
.grp2{margin-bottom:22px}.grp2 h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px}
.set{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end;margin-bottom:12px}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.set{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap hidden" id="loginView">
  <div class="card login-card">
    <div class="brand" style="justify-content:center;margin-bottom:6px"><img src="/icon-512.png" alt="">Command Center</div>
    <p class="snap" style="text-align:center;margin:0 0 18px">ElavoFishAI admin — restricted access.</p>
    <div id="step1">
      <div style="margin-bottom:12px"><label for="au">Email</label><input id="au" type="email" autocomplete="username" placeholder="you@email.com"></div>
      <div style="margin-bottom:16px"><label for="ap">Password</label><input id="ap" type="password" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%">Continue</button>
    </div>
    <div id="step2" class="hidden">
      <p class="snap" style="margin:0 0 12px">Enter the 6-digit code sent to your email.</p>
      <div style="margin-bottom:16px"><label for="ac">Verification code</label><input id="ac" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
      <button class="btn btn-primary" id="mfaBtn" style="width:100%">Verify &amp; sign in</button>
    </div>
    <p class="msg" id="loginMsg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashView" class="hidden">
  <div class="shell">
    <aside class="side">
      <div class="brand"><img src="/icon-512.png" alt="">ElavoFishAI</div>
      <nav id="nav"></nav>
      <div class="out"><button class="nav-i" id="logoutBtn">↩ Sign out</button></div>
    </aside>
    <main class="main">
      <div class="top"><div><h1 id="pageTitle">Dashboard</h1><p class="muted snap" id="pageSub" style="margin:0"></p></div><span class="snap" id="whoami"></span></div>
      <div id="content"></div>
    </main>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
async function api(path,opt){
  opt=opt||{};
  const headers=Object.assign({},opt.headers);
  // Only declare JSON when we actually send a body — an empty body with
  // Content-Type: application/json makes Fastify 400 (breaks DELETE/logout/etc.).
  if(opt.body!=null && !headers['Content-Type']) headers['Content-Type']='application/json';
  const res=await fetch(path,Object.assign({credentials:'same-origin'},opt,{headers}));
  // An admin session lasts four hours and is never extended. When it ends, say
  // so and show the sign-in screen — a console full of stale numbers that
  // fails on the next click is worse than being told plainly.
  if(res.status===401&&path.indexOf('/api/admin/')===0&&path!=='/api/admin/me'&&path!=='/api/admin/login')sessionEnded();
  return res;
}
let SESSION_TIMER=null;
function sessionEnded(){
  if(SESSION_TIMER){ clearTimeout(SESSION_TIMER); SESSION_TIMER=null; }
  $('dashView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  $('step2').classList.add('hidden'); $('step1').classList.remove('hidden');
  const m=$('loginMsg'); if(m){ m.className='msg'; m.textContent='Your admin session expired after 4 hours. Sign in again.'; }
}
// Sign out on the dot rather than at the next failed click.
function armSessionTimer(expiresAt){
  if(SESSION_TIMER)clearTimeout(SESSION_TIMER);
  if(!expiresAt)return;
  const ms=new Date(expiresAt).getTime()-Date.now();
  if(ms<=0){ sessionEnded(); return; }
  // setTimeout tops out around 24.8 days; four hours is well inside that.
  SESSION_TIMER=setTimeout(function(){ api('/api/admin/logout',{method:'POST'}).catch(function(){}); sessionEnded(); },ms);
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-clbody]'); if(!b)return;
  const el=document.getElementById('clb-'+b.dataset.clbody); if(!el)return;
  el.classList.toggle('hidden'); b.textContent=el.classList.contains('hidden')?'Details':'Hide details';
});
// Email is only healthy if something has actually been delivered — a key
// being present says nothing about whether mail arrives.
function emailPill(eh,keySet){
  if(!eh) return keySet?'<span class="pill ok">on</span>':'<span class="pill down">off</span>';
  if(!eh.configured) return '<span class="pill down">not configured</span>';
  if(eh.lastError&&(!eh.lastSentAt||eh.lastErrorAt>eh.lastSentAt)) return '<span class="pill down">failing</span>';
  if(eh.sent) return '<span class="pill ok">'+eh.sent+' sent</span>';
  return '<span class="pill" style="background:#fff4e5;color:#b7791f">untested</span>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ago(x){ if(!x)return '—'; const s=(Date.now()-new Date(x))/1000; if(s<60)return 'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }
function dt(x){ return x?new Date(x).toLocaleDateString():'—'; }
let USERNAME='';

/* ---- auth ---- */
async function boot(){ const d=await (await api('/api/admin/me')).json(); if(d.admin){ showDash(d.admin); } else $('loginView').classList.remove('hidden'); }
$('loginBtn').onclick=async()=>{ USERNAME=$('au').value.trim(); $('loginMsg').textContent='';
  const d=await (await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:USERNAME,password:$('ap').value})})).json();
  if(d.error){ $('loginMsg').className='msg err'; $('loginMsg').textContent=d.error; return; }
  $('step1').classList.add('hidden'); $('step2').classList.remove('hidden');
  if(d.devCode){ $('ac').value=d.devCode; $('loginMsg').className='msg'; $('loginMsg').textContent='Dev mode: code '+d.devCode+' (email not configured yet).'; } };
$('mfaBtn').onclick=async()=>{ const r=await api('/api/admin/mfa',{method:'POST',body:JSON.stringify({username:USERNAME,code:$('ac').value.trim()})});
  if(!r.ok){ const d=await r.json(); $('loginMsg').className='msg err'; $('loginMsg').textContent=d.error||'Bad code.'; return; }
  // Go straight to the dashboard (no reload — avoids stale-cache / race issues).
  const d=await (await api('/api/admin/me')).json();
  if(d.admin){ showDash(d.admin); } else { $('loginMsg').className='msg err'; $('loginMsg').textContent='Signed in but the session cookie was blocked — enable cookies and retry.'; } };
$('logoutBtn').onclick=async()=>{ await api('/api/admin/logout',{method:'POST'}); location.reload(); };

/* ---- shell / nav ---- */
const NAV=[
  {h:'Overview',items:[['dashboard','📊 Dashboard'],['activity','⚡ Activity feed']]},
  {h:'People',items:[['users','👤 Users'],['flags','⚑ Reports']]},
  {h:'Content',items:[['lakes','🗺️ Lakes'],['sources','📣 Report sources']]},
  {h:'Growth',items:[['analytics','📈 Analytics'],['aicost','🪙 AI usage & cost']]},
  {h:'Security',items:[['admins','🛡️ Admins'],['signin','🔑 Sign-in links'],['audit','📜 Audit log']]},
  {h:'Operations',items:[['changelog','🧾 Changelog'],['errors','🐞 Client errors'],['health','💚 System health'],['upgrade','⬆️ Upgrade']]},
  {h:'Settings',items:[['environment','⚙️ Environment']]},
];
const TITLES={dashboard:['Dashboard','Live platform metrics.'],activity:['Activity feed','What just happened.'],users:['Users','Create, search and manage anglers.'],flags:['Reported content','What anglers have flagged, and what to do about it.'],lakes:['Lakes','Every lake added, with AI profiles + usage.'],sources:['Report sources','Where fishing reports are fetched from.'],analytics:['Analytics','Growth and engagement.'],aicost:['AI usage & cost','What the model calls burn, and what they cost.'],admins:['Admins','Manage Command Center accounts.'],signin:['Sign-in links','Whether magic links are being delivered — and a way in when they are not.'],audit:['Audit log','Every admin action.'],changelog:['Changelog','Every update, fix and change that has shipped.'],errors:['Client errors','JavaScript failures reported by the app, newest first.'],health:['System health','Services + runtime.'],upgrade:['Upgrade','Pull, rebuild and restart from here.'],environment:['Environment','Runtime configuration — secrets encrypted, applied live.']};
function showDash(admin){ $('loginView').classList.add('hidden'); $('dashView').classList.remove('hidden');
  $('whoami').textContent='Signed in as '+admin.username+(admin.expiresAt?' · session ends '+new Date(admin.expiresAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'');
  armSessionTimer(admin.expiresAt);
  $('nav').innerHTML=NAV.map(g=>'<div class="grp"><div class="grp-h">'+g.h+'</div>'+g.items.map(it=>'<button class="nav-i" data-tab="'+it[0]+'">'+it[1]+'</button>').join('')+'</div>').join('');
  $('nav').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b)go(b.dataset.tab); });
  go('dashboard');
}
function go(tab){
  document.querySelectorAll('.nav-i[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
  $('pageTitle').textContent=(TITLES[tab]||[tab])[0]; $('pageSub').textContent=(TITLES[tab]||['',''])[1];
  ({dashboard:tDashboard,activity:tActivity,users:tUsers,flags:tFlags,lakes:tLakes,sources:tSources,analytics:tAnalytics,aicost:tAiCost,admins:tAdmins,signin:tSignin,audit:tAudit,changelog:tChangelog,errors:tErrors,health:tHealth,upgrade:tUpgrade,environment:tEnv}[tab]||tDashboard)();
}

/* ---- panels ---- */
/* Reported content. The queue can delete what it points at — a queue you can
   only mark as read is a to-do list, not moderation. Each row shows the
   snapshot taken when the report was raised, because the author may well have
   deleted the original by now. */
const FLAG_LABEL={spam:'Spam',scam:'Scam',harassment:'Harassment',nudity:'Nudity',illegal:'Illegal',other:'Other'};
let FLAG_STATUS='open';
async function tFlags(){
  $('content').innerHTML='<div class="muted">Loading…</div>';
  const d=await (await api('/api/admin/flags?status='+encodeURIComponent(FLAG_STATUS))).json();
  const rows=d.flags||[];
  $('content').innerHTML=
    '<div class="metrics" style="margin-bottom:16px">'
    + metricCard(String(d.openCount||0),'Open reports','waiting on a decision')
    + metricCard(String(rows.length),'Shown','current filter')
    + '</div>'
    + '<div class="card" style="margin-bottom:16px"><div class="row">'
    + ['open','actioned','dismissed','all'].map(st=>'<button class="btn '+(FLAG_STATUS===st?'btn-primary':'btn-ghost')
        +' btn-sm" data-flagstatus="'+st+'">'+st[0].toUpperCase()+st.slice(1)+'</button>').join('')
    + '</div></div>'
    + (rows.length?rows.map(f=>'<div class="card" style="margin-bottom:12px">'
        + '<div class="row" style="justify-content:space-between;align-items:flex-start">'
        + '<div><b>'+esc(FLAG_LABEL[f.reason]||f.reason)+'</b> · <span class="muted">'+esc(f.targetType)+'</span>'
        + (f.reportCount>1?' <span class="pill down">'+f.reportCount+' reports</span>':'')
        + '<div class="snap">by '+esc(f.reporter.displayName)+' · '+ago(f.createdAt)
        + (f.status!=='open'?' · '+esc(f.status)+(f.reviewedBy?' by '+esc(f.reviewedBy):''):'')+'</div></div>'
        + (f.status==='open'?'<div class="row" style="flex:0 0 auto">'
            + '<button class="btn btn-ghost btn-sm" data-flagact="dismiss" data-flagid="'+f.id+'">Dismiss</button>'
            + '<button class="btn btn-primary btn-sm" data-flagact="remove" data-flagid="'+f.id+'">Remove content</button></div>':'')
        + '</div>'
        + (f.note?'<div class="snap" style="margin-top:8px"><b>Reporter said:</b> '+esc(f.note)+'</div>':'')
        + '<pre style="white-space:pre-wrap;background:#f8fbff;border:1px solid #dce7f5;border-radius:10px;padding:10px;margin-top:10px;font-size:13px">'
        + esc(f.snapshot||'(the original is gone, and no snapshot was taken)')+'</pre>'
        + '</div>').join('')
      :'<div class="card"><div class="muted">Nothing here. That is the good outcome.</div></div>');

  $('content').querySelectorAll('[data-flagstatus]').forEach(b=>b.onclick=()=>{ FLAG_STATUS=b.dataset.flagstatus; tFlags(); });
  $('content').querySelectorAll('[data-flagact]').forEach(b=>b.onclick=async()=>{
    const act=b.dataset.flagact;
    if(act==='remove'&&!confirm('Delete the reported content? This cannot be undone.'))return;
    b.disabled=true;
    await api('/api/admin/flags/'+b.dataset.flagid,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:act})});
    tFlags();
  });
}

/* Report sources — operator-managed on purpose. We fetch what someone has
   deliberately pointed us at, not whatever we can reach. A regional source only
   attaches an item to a lake the item actually names. */
async function tSources(){
  $('content').innerHTML='<div class="muted">Loading…</div>';
  const d=await (await api('/api/admin/report-sources')).json();
  const counts=(d.counts||[]).reduce((m,c)=>{m[c.source]=c.n;return m;},{});
  $('content').innerHTML=
    '<div class="metrics" style="margin-bottom:16px">'
    + metricCard(String(counts.angler||0),'Angler reports','posted in the app')
    + metricCard(String(counts.agency||0),'Agency reports','fetched from feeds')
    + metricCard(String((d.sources||[]).filter(s=>s.active).length),'Active sources','refreshed every 6h')
    + '</div>'
    + '<div class="card" style="margin-bottom:16px"><h2>Add a source</h2>'
    + '<div class="snap" style="margin-bottom:10px">An RSS/Atom feed, or a page to read as text. Pin it to one lake, '
    + 'or leave the lake blank and give a region (e.g. “Texas”) — a regional source only stores items that name one of that region’s lakes.</div>'
    + '<div class="row">'
    + '<div style="flex:2;min-width:180px"><label>Name</label><input id="rsName" placeholder="TPWD freshwater reports"></div>'
    + '<div style="flex:3;min-width:240px"><label>URL</label><input id="rsUrl" placeholder="https://…/reports.rss"></div>'
    + '<div><label>Kind</label><select id="rsKind" style="width:auto"><option value="rss">RSS / Atom</option><option value="html">Web page</option></select></div>'
    + '<div style="flex:1;min-width:130px"><label>Region</label><input id="rsRegion" placeholder="Texas"></div>'
    + '<button class="btn btn-primary" id="rsAdd">Add &amp; fetch</button></div>'
    + '<div class="msg" id="rsMsg"></div></div>'
    + '<div class="card" style="padding:6px 10px;overflow:auto;margin-bottom:16px"><table><thead><tr>'
    + '<th>Source</th><th>Scope</th><th>Last fetched</th><th>Status</th><th></th></tr></thead><tbody>'
    + ((d.sources||[]).map(s=>'<tr><td><b>'+esc(s.name)+'</b><div class="snap">'+esc(s.url)+'</div></td>'
        +'<td class="muted">'+esc(s.lakeId?'one lake':(s.region||'all lakes'))+'</td>'
        +'<td class="muted">'+(s.lastFetchedAt?ago(s.lastFetchedAt):'never')+'</td>'
        +'<td>'+(s.lastError?'<span class="pill down" title="'+esc(s.lastError)+'">failing</span>':'<span class="pill ok">ok</span>')+'</td>'
        +'<td><button class="btn btn-ghost btn-sm" data-rsdel="'+s.id+'">Remove</button></td></tr>').join('')
       || '<tr><td colspan="5" class="muted" style="padding:14px">No sources yet. Anglers can still post reports in the app.</td></tr>')
    + '</tbody></table></div>'
    + '<div class="row" style="margin-bottom:14px"><button class="btn btn-ghost btn-sm" id="rsRefresh">Refresh all now</button><span class="msg" id="rsRefreshMsg"></span></div>'
    + '<div class="card" style="padding:6px 10px;overflow:auto"><h2 style="padding:10px 4px 0">Latest reports stored</h2><table><thead><tr>'
    + '<th>Lake</th><th>Source</th><th>Title</th><th>Dated</th></tr></thead><tbody>'

/* AI usage & cost — cost is stored per call at the price in force then, so
   these totals don't drift when pricing changes. A model with no rate shows as
   unpriced rather than free. */
const money=n=>'$'+(n<0.01&&n>0?n.toFixed(4):n.toFixed(2));
const tok=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n||0);
const FEAT={day_plan:'Day plans',lake_profile:'Lake guides',identify_catch:'Catch photos'};
let AI_DAYS=30;
async function tAiCost(){
  $('content').innerHTML='<div class="muted">Loading…</div>';
  const d=await (await api('/api/admin/ai-usage?days='+AI_DAYS)).json();
  const t=d.totals||{};
  const perDay=t.calls?(t.costUsd/Math.max(1,AI_DAYS)):0;
  const cards=[
    [money(t.costUsd||0),'Spend · last '+AI_DAYS+' days',money(perDay)+'/day average'],
    [String(t.calls||0),'Model calls',(t.failures?t.failures+' failed':'none failed')],
    [tok(t.inputTokens||0),'Input tokens',(t.cacheReadTokens?tok(t.cacheReadTokens)+' from cache':'no cache reads')],
    [tok(t.outputTokens||0),'Output tokens',(t.avgMs?t.avgMs+' ms average':'')],
    [String(t.webSearches||0),'Web searches',(t.webSearches?money(t.webSearches*0.01)+' of the spend':'search is off')],
  ];
  let h='<div class="row" style="margin:0 0 14px;gap:8px;align-items:center">'
    +[7,30,90].map(n=>'<button class="btn btn-sm '+(AI_DAYS===n?'btn-primary':'btn-ghost')+'" data-aidays="'+n+'">'+n+' days</button>').join('')
    +'<button class="btn btn-ghost btn-sm" id="aiRecalc" style="margin-left:auto" title="Re-price stored usage from the current rate table">Recalculate costs</button>'
    +'<span class="snap" id="aiRecalcMsg"></span></div>'
    +'<div class="metrics">'+cards.map(c=>'<div class="metric"><div class="n">'+esc(c[0])+'</div><div class="k">'+esc(c[1])+'</div>'+(c[2]?'<div class="s">'+esc(c[2])+'</div>':'')+'</div>').join('')+'</div>';

  if((d.unpriced||[]).length) h+='<div class="card" style="margin-top:14px;border-color:#f0d9a8"><b style="color:#b7791f">No price on file for: '+d.unpriced.map(esc).join(', ')+'</b><div class="snap" style="margin-top:6px">Those calls are counted but costed at $0. Add the rate in server/src/services/aiUsage.ts.</div></div>';

  h+='<div class="row" style="margin-top:16px;align-items:stretch;gap:16px;flex-wrap:wrap">'
    +'<div class="card" style="flex:1;min-width:280px"><h2>By feature</h2><table><thead><tr><th>Feature</th><th>Calls</th><th>In</th><th>Out</th><th style="text-align:right">Cost</th></tr></thead><tbody>'
    +((d.byFeature||[]).map(f=>'<tr><td>'+esc(FEAT[f.feature]||f.feature)+'</td><td>'+f.calls+'</td><td class="muted">'+tok(f.inputTokens)+'</td><td class="muted">'+tok(f.outputTokens)+'</td><td style="text-align:right;font-weight:700">'+money(f.costUsd)+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">No calls yet.</td></tr>')
    +'</tbody></table></div>'
    +'<div class="card" style="flex:1;min-width:280px"><h2>By model</h2><table><thead><tr><th>Model</th><th>Calls</th><th title="Angler feedback on plans this model wrote">Rated</th><th style="text-align:right">Cost</th></tr></thead><tbody>'
    +((d.byModel||[]).map(m=>{
        const votes=(m.up||0)+(m.down||0);
        const rated=votes?('<span class="pill '+(m.up>=m.down?'ok':'down')+'">'+Math.round((m.up/votes)*100)+'% 👍</span> <span class="snap">'+votes+'</span>'):'<span class="snap">—</span>';
        return '<tr><td>'+esc(m.model)+(m.priced?'':' <span class="pill" style="background:#fff4e5;color:#b7791f">unpriced</span>')+'</td><td>'+m.calls+'</td><td>'+rated+'</td><td style="text-align:right;font-weight:700">'+money(m.costUsd)+'</td></tr>';
      }).join('')||'<tr><td colspan="4" class="muted">No calls yet.</td></tr>')
    +'</tbody></table></div></div>'
    +((d.notes||[]).length?'<div class="card" style="margin-top:16px"><h2>What anglers said</h2>'
      +d.notes.map(n=>'<div class="fr-row" style="border-bottom:1px solid var(--border);padding:8px 0">'
        +(n.helpful?'👍':'👎')+' <span style="margin-left:8px">'+esc(n.note||'')+'</span>'
        +'<span class="snap" style="margin-left:auto">'+esc(n.model||'')+' · '+ago(n.createdAt)+'</span></div>').join('')
      +'</div>':'');

  const days=d.byDay||[];
  if(days.length){
    const max=Math.max.apply(null,days.map(x=>x.cost))||1;
    h+='<div class="card" style="margin-top:16px"><h2>Daily spend</h2>'
      +days.slice().reverse().map(x=>'<div style="display:flex;align-items:center;gap:10px;margin:5px 0">'
        +'<span class="snap" style="min-width:78px">'+new Date(x.day).toLocaleDateString()+'</span>'
        +'<span style="flex:1;background:var(--sky);border-radius:5px;height:16px;position:relative"><span style="position:absolute;inset:0 auto 0 0;width:'+Math.max(2,(x.cost/max)*100)+'%;background:var(--primary);border-radius:5px"></span></span>'
        +'<span class="snap" style="min-width:64px;text-align:right">'+money(x.cost)+'</span>'
        +'<span class="snap" style="min-width:56px;text-align:right">'+x.calls+' call'+(x.calls===1?'':'s')+'</span></div>').join('')
      +'</div>';
  }

  h+='<div class="card" style="margin-top:16px;padding:6px 10px;overflow:auto"><table><thead><tr><th>When</th><th>Feature</th><th>Model</th><th>In</th><th>Out</th><th>Took</th><th style="text-align:right">Cost</th></tr></thead><tbody>'
    +((d.recent||[]).map(r=>'<tr><td class="muted">'+ago(r.createdAt)+'</td><td>'+esc(FEAT[r.feature]||r.feature)+(r.ok?'':' <span class="pill down">failed</span>')+'</td><td class="snap">'+esc(r.model)+'</td><td class="muted">'+tok(r.inputTokens)+'</td><td class="muted">'+tok(r.outputTokens)+'</td><td class="muted">'+(r.ms?(r.ms/1000).toFixed(1)+'s':'—')+'</td><td style="text-align:right">'+money(r.costUsd)+'</td></tr>').join('')||'<tr><td colspan="7" class="muted" style="padding:14px">Nothing yet.</td></tr>')
    +'</tbody></table></div>';

  $('content').innerHTML=h;
  document.querySelectorAll('[data-aidays]').forEach(b=>b.onclick=()=>{ AI_DAYS=+b.dataset.aidays; tAiCost(); });
  $('aiRecalc').onclick=async function(){
    $('aiRecalcMsg').textContent='Recalculating…';
    const r=await api('/api/admin/ai-usage/recalculate',{method:'POST'});
    const d=await r.json();
    $('aiRecalcMsg').textContent=r.ok?(d.changed+' of '+d.rows+' rows re-priced ('+money(d.before)+' → '+money(d.after)+')'):'Failed.';
    if(r.ok)setTimeout(tAiCost,1500);
  };
}

/* Sign-in links — diagnostics for magic-link delivery plus a break-glass
   generator. Tokens are stored hashed, so an existing link can never be read
   back; the generator mints a fresh one and shows it once. */
async function tSignin(){
  $('content').innerHTML='<div class="muted">Loading…</div>';
  const d=await (await api('/api/admin/magic-links')).json();
  const e=d.email||{};
  let banner='';
  if(!e.configured) banner='<div class="card" style="margin-bottom:16px;border-color:#f3c6c6"><b style="color:var(--bear)">Email is not configured.</b><div class="snap" style="margin-top:6px">No RESEND_API_KEY — nobody can receive a sign-in link. Set it under Environment, or use the generator below.</div></div>';
  else if(e.fromIsDefault) banner='<div class="card" style="margin-bottom:16px;border-color:#f0d9a8"><b style="color:#b7791f">No EMAIL_FROM set.</b><div class="snap" style="margin-top:6px">Resend\'s shared onboarding sender only delivers to your own account address — every other angler gets nothing. Verify a domain in Resend and set EMAIL_FROM under Environment.</div></div>';
  else if(e.lastError&&(!e.lastSentAt||e.lastErrorAt>e.lastSentAt)) banner='<div class="card" style="margin-bottom:16px;border-color:#f3c6c6"><b style="color:var(--bear)">Last email failed.</b><div class="snap" style="margin-top:6px">'+esc(e.lastError)+'</div></div>';

  $('content').innerHTML=banner
    + '<div class="card" style="margin-bottom:16px"><h2>Generate a sign-in link</h2>'
    + '<div class="snap" style="margin-bottom:10px">For when email delivery is down. The link signs that person in — treat it like a password. Every use is written to the audit log.</div>'
    + '<div class="row"><div style="flex:1;min-width:220px"><label>Email</label><input id="slEmail" type="email" placeholder="angler@email.com"></div>'
    + '<button class="btn btn-primary" id="slGo">Generate</button></div><div id="slOut" class="msg"></div></div>'
    + '<div class="card" style="padding:6px 10px;overflow:auto"><table id="slTable"><thead><tr><th>Email</th><th>Purpose</th><th>Requested</th><th>State</th><th>From IP</th></tr></thead><tbody>'
    + ((d.links||[]).map(l=>'<tr><td>'+esc(l.email)+'</td><td class="muted">'+esc(l.purpose)+'</td><td class="muted">'+ago(l.createdAt)+'</td><td>'+slState(l.state)+'</td><td class="snap">'+esc(l.ip||'')+'</td></tr>').join('')
       || '<tr><td colspan="5" class="muted" style="padding:14px">No sign-in links requested yet.</td></tr>')
    + '</tbody></table></div>';
  $('slGo').onclick=genSigninLink;
}
function slState(s){
  if(s==='used') return '<span class="pill ok">used</span>';
  if(s==='expired') return '<span class="pill" style="background:#eef1f5;color:#5f708a">expired</span>';
  return '<span class="pill" style="background:#fff4e5;color:#b7791f">unused</span>';
}
async function genSigninLink(){
  const email=$('slEmail').value.trim(); const out=$('slOut');
  if(!email){ out.className='msg err'; out.textContent='Enter an email.'; return; }
  out.className='msg'; out.textContent='Generating…';
  const r=await api('/api/admin/signin-link',{method:'POST',body:JSON.stringify({email})});
  const d=await r.json();
  if(!r.ok){ out.className='msg err'; out.textContent=d.error||'Could not generate a link.'; return; }
  out.className='msg ok';
  out.innerHTML='Link for <b>'+esc(email)+'</b> ('+esc(d.purpose)+(d.emailed?', also emailed':'')+'), expires '+new Date(d.expiresAt).toLocaleTimeString()+':'
    +'<div style="margin-top:8px;display:flex;gap:8px;align-items:center"><input id="slUrl" readonly value="'+esc(d.url)+'" style="font-family:ui-monospace,Menlo,monospace;font-size:12px">'
    +'<button class="btn btn-sm" id="slCopy">Copy</button></div>';
  $('slCopy').onclick=()=>{ $('slUrl').select(); try{document.execCommand('copy');$('slCopy').textContent='Copied';}catch(e){} };
  tSigninRefreshSoon();
}
function tSigninRefreshSoon(){ setTimeout(()=>{ const t=$('slTable'); if(t) tSignin(); },1200); }

/* Changelog — the shipped history of the app: every commit behind the running
   build, classified, searchable and grouped by day (Central Time). Commits
   pushed but not yet deployed appear on top marked "Not deployed". */
const CL={q:'',offset:0,limit:50,groups:[],meta:null,timer:null,req:0};
const CL_TYPE={feat:['Feature','✨'],fix:['Fix','🐛'],perf:['Perf','⚡'],refactor:['Refactor','♻️'],docs:['Docs','📝'],test:['Tests','🧪'],build:['Build','📦'],ci:['CI','🔧'],style:['Style','💅'],chore:['Chore','🧹'],revert:['Revert','⏪'],other:['Other','•']};
function clTime(iso){ try{ return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'}).format(new Date(iso))+' CT'; }catch(e){ return ''; } }
function clDateTime(iso){ try{ return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(iso))+' CT'; }catch(e){ return ''; } }
async function tChangelog(){
  $('content').innerHTML=
    '<div class="row" style="margin:0 0 6px;align-items:center">'
    + '<input id="clQ" placeholder="Search updates — feature, fix, scope, file, sha…" style="max-width:420px" value="'+esc(CL.q)+'">'
    + '<button class="btn btn-ghost btn-sm" id="clReload">Refresh</button>'
    + '</div>'
    + '<div class="snap" id="clMeta" style="margin-bottom:12px"></div>'
    + '<div id="clFeed"><p class="muted">Loading…</p></div>'
    + '<div style="text-align:center;margin-top:14px"><button class="btn btn-ghost btn-sm hidden" id="clMore">Load more</button></div>';
  $('clReload').onclick=()=>clLoad(CL.q,0);
  // Debounced search — a keystroke shouldn't fire a request.
  $('clQ').addEventListener('input',e=>{ clearTimeout(CL.timer); const v=e.target.value.trim(); CL.timer=setTimeout(()=>clLoad(v,0),300); });
  $('clMore').onclick=()=>clLoad(CL.q,CL.groups.reduce((n,g)=>n+g.commits.length,0));
  clLoad(CL.q,0);
}
async function clLoad(q,offset){
  const mine=++CL.req;
  CL.q=q;
  if(!offset) $('clFeed').innerHTML='<p class="muted">Loading…</p>';
  try{
    const r=await api('/api/admin/changelog?q='+encodeURIComponent(q)+'&offset='+offset+'&limit='+CL.limit);
    const d=await r.json();
    if(mine!==CL.req) return;               // a newer request won
    if(!r.ok){ $('clFeed').innerHTML='<p class="msg err">'+esc(d.error||'Could not load the changelog.')+'</p>'; return; }
    CL.meta=d;
    if(offset===0) CL.groups=d.groups||[];
    else {
      // Merge a day split across pages so it stays one block.
      (d.groups||[]).forEach(g=>{ const last=CL.groups[CL.groups.length-1];
        if(last&&last.date===g.date) last.commits=last.commits.concat(g.commits); else CL.groups.push(g); });
    }
    clRender();
  }catch(e){ if(mine===CL.req) $('clFeed').innerHTML='<p class="msg err">Server not reachable.</p>'; }
}
function clRender(){
  const d=CL.meta||{};
  let meta=CL.q?('<b>'+d.total+'</b> match'+(d.total===1?'':'es')+' for “'+esc(CL.q)+'”'):('<b>'+d.total+'</b> update'+(d.total===1?'':'s'));
  if(d.latestDeploy) meta+=' &nbsp;·&nbsp; 🚀 Live build shipped '+clDateTime(d.latestDeploy.deployedAt);
  if(d.pendingCount) meta+=' &nbsp;·&nbsp; <span style="color:#b7791f">⏱ '+d.pendingCount+' commit'+(d.pendingCount===1?'':'s')+' not deployed — see Upgrade</span>';
  if(d.scanCapped) meta+=' &nbsp;·&nbsp; showing the most recent '+d.scanned+' commits';
  $('clMeta').innerHTML=meta;

  if(!CL.groups.length){ $('clFeed').innerHTML='<p class="muted">'+(CL.q?'No updates match “'+esc(CL.q)+'”.':'No history available in this build.')+'</p>'; }
  else $('clFeed').innerHTML=CL.groups.map(g=>
    '<div class="cl-day">'+esc(g.label)+'</div>'+g.commits.map(clRow).join('')
  ).join('');

  const shown=CL.groups.reduce((n,g)=>n+g.commits.length,0);
  $('clMore').classList.toggle('hidden',!d.hasMore);
  $('clMore').textContent='Load more ('+(d.total-shown)+' older)';
}
function clRow(c){
  const t=CL_TYPE[c.type]||CL_TYPE.other;
  const tags='<span class="pill t-'+esc(c.type)+'">'+t[1]+' '+t[0]+'</span>'
    + (c.scope?'<span class="pill" style="background:#eef1f5;color:#5f708a">'+esc(c.scope)+'</span>':'')
    + (c.breaking?'<span class="pill" style="background:#fdeaea;color:#b3261e">BREAKING</span>':'');
  const when = c.deployPending
    ? '<span class="pill" style="background:#fff4e5;color:#b7791f" title="Committed but not in the running build">⏱ Not deployed</span>'
    : c.deployedAt
      ? '<span class="snap" style="color:var(--bull)" title="Went live with this build">🚀 '+clTime(c.deployedAt)+'</span>'
      : '<span class="snap" title="Commit time">'+clTime(c.committedAt)+'</span>';
  const body=(c.body||'').trim();
  return '<div class="cl-row"><div class="cl-main"><div class="cl-tags">'+tags+'</div>'
    + '<div class="cl-sum">'+esc(c.summary)+'</div>'
    + (body?'<button class="cl-more" data-clbody="'+esc(c.sha)+'">Details</button><div class="cl-body hidden" id="clb-'+esc(c.sha)+'">'+esc(body)+'</div>':'')
    + '</div><div class="cl-side">'+when+'<span class="cl-sha">'+esc(c.shortSha)+'</span></div></div>';
}

async function loadUsers(){ const q=$('uSearch')?$('uSearch').value.trim():''; const d=await (await api('/api/admin/users'+(q?'?q='+encodeURIComponent(q):''))).json();
  $('uTable').querySelector('tbody').innerHTML=(d.users||[]).map(u=>'<tr><td><b>'+esc(u.displayName||'')+'</b><br><span class="snap">'+esc(u.email)+'</span></td>'+
    '<td><select class="role" data-id="'+u.id+'" style="width:auto;padding:4px 8px;font-size:12px">'+['user','pro','guide','admin'].map(r=>'<option'+(r===u.role?' selected':'')+'>'+r+'</option>').join('')+'</select></td>'+
    '<td><span class="pill '+u.status+'">'+u.status+'</span></td><td>'+u.lakes+'</td><td>'+dt(u.createdAt)+'</td><td>'+dt(u.lastLoginAt)+'</td>'+
    '<td style="white-space:nowrap"><button class="btn btn-ghost btn-sm us" data-id="'+u.id+'" data-s="'+(u.status==='active'?'suspended':'active')+'">'+(u.status==='active'?'Suspend':'Reactivate')+'</button> '+
    '<button class="btn btn-danger btn-sm ud" data-id="'+u.id+'" data-n="'+esc(u.displayName||u.email)+'">Delete</button></td></tr>').join('')||'<tr><td colspan="7" class="muted">No users.</td></tr>';
}
async function createUser(){ const email=$('nuEmail').value.trim(); if(!email){$('nuMsg').textContent='Email required.';return;}
  const r=await api('/api/admin/users',{method:'POST',body:JSON.stringify({email,displayName:$('nuName').value.trim(),role:$('nuRole').value})}); const d=await r.json();
  $('nuMsg').className='msg '+(r.ok?'ok':'err'); $('nuMsg').textContent=r.ok?'Created ✓':(d.error||'Failed'); if(r.ok){$('nuEmail').value='';$('nuName').value='';loadUsers();}
}
async function onUserAction(e){ const s=e.target.closest('.us'),del=e.target.closest('.ud');
  if(s){ await api('/api/admin/users/'+s.dataset.id+'/status',{method:'POST',body:JSON.stringify({status:s.dataset.s})}); loadUsers(); }
  if(del){ if(!confirm('Delete '+del.dataset.n+'? This removes their account and all their data. This cannot be undone.'))return; await api('/api/admin/users/'+del.dataset.id,{method:'DELETE'}); loadUsers(); }
}
async function onUserRole(e){ const s=e.target.closest('.role'); if(s)await api('/api/admin/users/'+s.dataset.id+'/role',{method:'POST',body:JSON.stringify({role:s.value})}); }

async function tLakes(){ const d=await (await api('/api/admin/lakes')).json();
  $('content').innerHTML='<div class="card" style="padding:6px 10px;overflow:auto"><table><thead><tr><th>Lake</th><th>Region</th><th>AI profile</th><th>Saved by</th><th>Catches</th></tr></thead><tbody>'+
   ((d.lakes||[]).map(l=>'<tr><td><b>'+esc(l.name)+'</b></td><td class="snap">'+esc(l.region||'—')+'</td><td>'+(l.profile?('<span class="pill '+(l.verified?'ok':'active')+'">'+(l.verified?'verified':l.profile)+'</span>'):'<span class="snap">none</span>')+'</td><td>'+l.savedBy+'</td><td>'+l.catches+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">No lakes.</td></tr>')+'</tbody></table></div>';
}
async function tAnalytics(){ const m=await (await api('/api/admin/metrics')).json();
  const bars=[['New users (7d)',m.new7,Math.max(m.users,1)],['Active 7d',m.active7,Math.max(m.users,1)],['Active 30d',m.active30,Math.max(m.users,1)]];
  $('content').innerHTML='<div class="card"><h2>Engagement</h2>'+bars.map(b=>'<div style="margin-bottom:12px"><div class="snap" style="margin-bottom:4px">'+b[0]+' — <b>'+b[1]+'</b></div><div style="background:var(--sky);border-radius:6px;height:12px"><div style="background:var(--primary);height:12px;border-radius:6px;width:'+Math.round(b[1]/b[2]*100)+'%"></div></div></div>').join('')+
   '<div class="snap" style="margin-top:8px">Lakes '+m.lakes+' · Trip logs '+m.tripLogs+' · AI profiles '+m.profiles+' · Day plans '+m.dayPlans+'</div></div>';
}
async function tAdmins(){ const d=await (await api('/api/admin/admins')).json();
  $('content').innerHTML='<div class="card" style="margin-bottom:16px"><h2>Add an admin</h2><div class="row">'+
   '<p class="snap" style="margin:-6px 0 12px">Admins sign in with their email address — a 6-digit code is sent there at login.</p><div class="row">'+
   '<div style="flex:1;min-width:180px"><label>Email</label><input id="aaE" type="email" placeholder="admin@email.com"></div>'+
   '<div style="flex:1;min-width:140px"><label>Password</label><input id="aaP" type="password" placeholder="min 8 characters"></div><button class="btn btn-primary" id="aaAdd">Create admin</button><span class="msg" id="aaMsg"></span></div></div>'+
   '<div class="card" style="padding:6px 10px;overflow:auto"><table><thead><tr><th>Email</th><th>Created</th><th>Last login</th><th></th></tr></thead><tbody>'+
   (d.admins||[]).map(a=>'<tr><td><b>'+esc(a.email)+'</b>'+(a.username===d.me?' <span class="snap">(you)</span>':'')+'</td><td>'+dt(a.createdAt)+'</td><td>'+ago(a.lastLoginAt)+'</td><td>'+(a.username===d.me?'':'<button class="btn btn-danger btn-sm ad" data-id="'+a.id+'" data-n="'+esc(a.email)+'">Delete</button>')+'</td></tr>').join('')+'</tbody></table></div>';
  $('aaAdd').onclick=async()=>{ const r=await api('/api/admin/admins',{method:'POST',body:JSON.stringify({email:$('aaE').value.trim(),password:$('aaP').value})}); const j=await r.json(); $('aaMsg').className='msg '+(r.ok?'ok':'err'); $('aaMsg').textContent=r.ok?'Created ✓':(j.error||'Failed'); if(r.ok)tAdmins(); };
  $('content').addEventListener('click',async e=>{ const b=e.target.closest('.ad'); if(!b)return; if(!confirm('Delete admin '+b.dataset.n+'?'))return; const r=await api('/api/admin/admins/'+b.dataset.id,{method:'DELETE'}); if(!r.ok){const j=await r.json();alert(j.error||'Failed');} tAdmins(); });
}
async function tAudit(){ const d=await (await api('/api/admin/audit')).json();
  $('content').innerHTML='<div class="card" style="padding:6px 10px;overflow:auto"><table><thead><tr><th>When</th><th>Action</th><th>By</th><th>Details</th></tr></thead><tbody>'+
   ((d.log||[]).map(l=>'<tr><td class="snap">'+ago(l.createdAt)+'</td><td><b>'+esc(l.action)+'</b></td><td>'+esc((l.meta&&l.meta.by)||'—')+'</td><td class="snap">'+esc(JSON.stringify(l.meta||{}))+'</td></tr>').join('')||'<tr><td colspan="4" class="muted">No admin actions logged yet.</td></tr>')+'</tbody></table></div>';
}
function fmtBytes(n){ if(!n||n<0)return '—'; const u=['B','KB','MB','GB','TB']; let i=0,x=n; while(x>=1024&&i<u.length-1){x/=1024;i++;} return x.toFixed(x<10&&i>0?1:0)+' '+u[i]; }
function fmtUp(s){ if(!s)return '—'; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return d?d+'d '+h+'h':(h?h+'h '+m+'m':m+'m'); }
function usageBar(p){ p=Math.max(0,Math.min(100,Math.round(p))); const col=p>=90?'#DC2626':p>=75?'#D97706':'#16A34A'; return '<div style="height:6px;background:#eef2f7;border-radius:4px;margin-top:8px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:'+col+'"></div></div>'; }
function metricCard(n,k,s,bar){ return '<div class="metric"><div class="n" style="font-size:22px">'+n+'</div><div class="k">'+k+'</div>'+(s?'<div class="s">'+s+'</div>':'')+(bar||'')+'</div>'; }
async function tHealth(){ $('content').innerHTML='<div class="muted">Loading system health…</div>';
  const h=await (await api('/api/admin/health')).json();
  const yn=b=>b?'<span class="pill ok">on</span>':'<span class="pill down">off</span>';
  const pct=(a,b)=>b?a/b*100:0;
  const cpu=h.cpu||{}, mem=h.mem||{}, disk=h.disk;
  const cpuPct=pct(cpu.load1||0,cpu.cores||1);
  const memUsed=(mem.total||0)-(mem.free||0), memPct=pct(memUsed,mem.total||0);
  const diskUsed=disk?(disk.total-disk.free):0, diskPct=disk?pct(diskUsed,disk.total):0;
  const status=h.status==='ok'?'<span class="pill ok" style="font-size:14px">Healthy</span>':'<span class="pill down" style="font-size:14px">Degraded</span>';
  const c=h.counts||{};
  const rows=[['Anglers',c.users],['Lakes',c.lakes],['Messages',c.messages],['Friendships',c.friendships],['Active sessions',c.sessions]];
  $('content').innerHTML=
    '<div class="metrics">'
    + metricCard(status,'Overall', 'Database '+(h.db==='ok'?'connected':'down'))
    + metricCard(Math.round(cpuPct)+'%','CPU load', 'load '+(cpu.load1!=null?cpu.load1.toFixed(2):'—')+' · '+(cpu.cores||'?')+' cores', usageBar(cpuPct))
    + metricCard(Math.round(memPct)+'%','Memory', fmtBytes(memUsed)+' / '+fmtBytes(mem.total), usageBar(memPct))
    + metricCard(disk?Math.round(diskPct)+'%':'—','Disk', disk?(fmtBytes(diskUsed)+' / '+fmtBytes(disk.total)):'n/a', disk?usageBar(diskPct):'')
    + metricCard(fmtBytes(h.dbBytes),'Database size', (h.dbConns||0)+' connection'+(h.dbConns===1?'':'s'))
    + metricCard(fmtUp(h.uptimeSec),'App uptime', 'host up '+fmtUp(h.hostUptimeSec))
    + '</div>'
    + '<div class="row" style="margin-top:16px;align-items:stretch;gap:16px;flex-wrap:wrap">'
    + '<div class="card" style="flex:1;min-width:260px"><h2>Records</h2><table>'
      + rows.map(r=>'<tr><td class="muted">'+r[0]+'</td><td style="text-align:right;font-weight:700">'+(r[1]!=null?r[1].toLocaleString():'—')+'</td></tr>').join('')
      + '</table></div>'
    + '<div class="card" style="flex:1;min-width:260px"><h2>Integrations & runtime</h2><table>'
      + '<tr><td class="muted">AI (Anthropic)</td><td style="text-align:right">'+yn(h.ai)+'</td></tr>'
      + '<tr><td class="muted">Email (Resend)</td><td style="text-align:right">'+emailPill(h.emailHealth,h.email)+'</td></tr>'
      + (h.emailHealth&&h.emailHealth.fromIsDefault&&h.emailHealth.configured?'<tr><td colspan="2" class="snap" style="color:#b7791f">⚠ No EMAIL_FROM set — Resend\'s shared sender only delivers to your own address. Verify a domain and set EMAIL_FROM, or nobody else can sign in.</td></tr>':'')
      + (h.emailHealth&&h.emailHealth.lastError?'<tr><td colspan="2" class="snap" style="color:var(--bear)">Last send failed '+ago(h.emailHealth.lastErrorAt)+': '+esc(h.emailHealth.lastError)+'</td></tr>':'')
      + (h.magicLinkDev?'<tr><td colspan="2" class="snap" style="color:#b7791f">⚠ Dev sign-in links are ON (private-network callers only).</td></tr>':'')
      + '<tr><td class="muted">AI spend (30d)</td><td style="text-align:right"><b>$'+((h.aiCost30d||0).toFixed(2))+'</b></td></tr>'
      + '<tr><td class="muted">Client errors (24h)</td><td style="text-align:right">'+(h.clientErrors24h?'<span class="pill down">'+h.clientErrors24h+'</span>':'<span class="pill ok">0</span>')+'</td></tr>'
      + '<tr><td class="muted">Mode</td><td style="text-align:right"><b>'+esc(h.mode)+'</b></td></tr>'
      + '<tr><td class="muted">Node</td><td style="text-align:right">'+esc(h.node)+'</td></tr>'
      + '<tr><td class="muted">Platform</td><td style="text-align:right">'+esc(h.platform||'')+' · '+esc(h.arch||'')+'</td></tr>'
      + '<tr><td class="muted">CPU</td><td style="text-align:right;max-width:220px;font-size:12px">'+esc(cpu.model||'')+'</td></tr>'
      + '<tr><td class="muted">App memory (RSS)</td><td style="text-align:right">'+fmtBytes(mem.appRss)+'</td></tr>'
      + '</table></div>'
    + '</div>';
}
function renderVer(v){ const el=$('verCard'); if(!el)return;
  if(!v){ el.innerHTML='<div class="muted">Version info unavailable.</div>'; return; }
  const c=v.current||{}, t=v.target||{}, inc=v.incoming||[];
  const sha=s=>s?'<span style="font-family:ui-monospace,Menlo,monospace">'+esc(String(s).slice(0,12))+'</span>':'<span class="muted">unknown</span>';
  let badge;
  if(t.error) badge='<span class="pill" style="background:#eef1f5;color:#5f708a">can’t reach remote</span>';
  else if(v.upToDate) badge='<span class="pill ok">✓ Up to date</span>';
  else badge='<span class="pill" style="background:#fff4e5;color:#b7791f">↑ '+inc.length+' behind</span>';
  let body='<h2 style="margin-bottom:14px">Version &nbsp;'+badge+'</h2>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:14px">'
    +'<div><div class="k">Current</div><div>'+sha(c.commit||c.commitShort)+(c.version?' <span class="snap">v'+esc(c.version)+'</span>':'')+'</div>'+(c.subject?'<div class="snap" style="margin-top:3px">'+esc(c.subject)+'</div>':'')+(c.builtAt?'<div class="snap">built '+dt(c.builtAt)+'</div>':'')+'</div>'
    +'<div><div class="k">Remote ('+esc(t.branch||v.branch||'main')+')</div><div>'+sha(t.commit||t.commitShort)+'</div>'+(t.subject?'<div class="snap" style="margin-top:3px">'+esc(t.subject)+'</div>':'')+(t.error?'<div class="snap" style="color:var(--bear)">'+esc(t.error)+'</div>':'')+'</div>'
    +'</div>';
  if(t.error){ /* nothing more */ }
  else if(v.upToDate){ body+='<div class="msg ok" style="margin-top:14px">✓ You’re running the latest '+esc(t.branch||'main')+'.</div>'; }
  else if(!c.commit){ body+='<div class="snap" style="margin-top:14px">Current build has no version stamp yet — it will appear after the next deploy.</div>'; }
  else if(inc.length){
    body+='<div class="k" style="margin:16px 0 6px">Incoming ('+inc.length+' commit'+(inc.length===1?'':'s')+')</div>'
      +'<div style="border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:10px 12px;max-height:220px;overflow:auto;font-size:12px">'
      +inc.map(x=>'<div style="display:flex;gap:10px;padding:2px 0"><span style="font-family:ui-monospace,Menlo,monospace;color:var(--muted)">'+esc(x.sha)+'</span><span>'+esc(x.subject)+'</span></div>').join('')
      +'</div>';
  } else {
    body+='<div class="snap" style="margin-top:14px">The running build differs from <b>'+esc(t.branch||'main')+'</b> (commit list unavailable — the current build may be ahead of, or not pushed to, the remote).</div>';
  }
  el.innerHTML=body;
  // reflect the target on the upgrade button
  const b=$('upBtn'); if(b&&!v.upToDate&&!t.error&&t.commit) b.textContent='Upgrade to '+String(t.commit).slice(0,7);
}
async function tUpgrade(){ $('content').innerHTML='<div class="card" id="verCard" style="margin-bottom:16px"><div class="muted">Loading version…</div></div><div class="card"><div class="row" style="margin-bottom:14px"><button class="btn btn-primary" id="upBtn">Upgrade now</button><span class="msg" id="upMsg"></span></div><pre id="upLog">Loading…</pre></div>';
  const load=async()=>{ const d=await (await api('/api/admin/upgrade/status')).json(); renderVer(d.version); $('upLog').textContent=d.log||'No upgrade has run yet.'; $('upBtn').disabled=d.running||!d.configured; if(!d.configured)$('upMsg').innerHTML='<span class="muted">Host upgrade agent not configured.</span>'; };
  $('upBtn').onclick=async()=>{ if(!confirm('Pull latest code, rebuild and restart? Brief downtime.'))return; const d=await (await api('/api/admin/upgrade',{method:'POST'})).json(); $('upMsg').className='msg '+(d.ok?'ok':'err'); $('upMsg').textContent=d.ok?'Upgrade started — watch the log.':(d.error||'Could not start.'); };
  load(); clearInterval(window.__upT); window.__upT=setInterval(()=>{ if($('upLog'))load(); },3000);
}
function cfgField(i){
  if(i.choices&&i.choices.length){
    return '<select class="cfgfield" data-k="'+i.key+'">'+i.choices.map(o=>'<option value="'+esc(o)+'"'+(i.value===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  }
  return '<input class="cfgfield" data-k="'+i.key+'" '+(i.secret?'type="password"':'')+' placeholder="'+esc(i.placeholder||'')+'" value="'+esc(i.value||'')+'">';
}
async function tEnv(){ const d=await (await api('/api/admin/config')).json();
  $('content').innerHTML='<div class="card"><div id="settings"></div><div class="row" style="margin-top:8px"><button class="btn btn-ghost btn-sm" id="reloadCfg">Reload all</button><span class="msg" id="cfgMsg"></span></div></div>';
  $('settings').innerHTML=d.groups.map(g=>{ const items=d.items.filter(i=>i.group===g);
    return '<div class="grp2"><h3>'+esc(g)+'</h3>'+items.map(i=>'<div class="set"><div><label>'+esc(i.label)+(i.set?' <span class="snap" style="color:var(--bull)">· set</span>':'')+'</label>'+cfgField(i)+(i.help?'<div class="snap" style="margin-top:4px">'+esc(i.help)+'</div>':'')+'</div><button class="btn btn-ghost btn-sm save" data-k="'+i.key+'">Save</button>'+(i.test?'<button class="btn btn-ghost btn-sm test" data-k="'+i.key+'">Test</button>':'<span></span>')+'</div>').join('')+'</div>';
  }).join('');
  $('settings').addEventListener('click',async e=>{ const save=e.target.closest('.save'),test=e.target.closest('.test');
    if(save){ const k=save.dataset.k,v=$('settings').querySelector('.cfgfield[data-k="'+k+'"]').value; save.textContent='Saving…'; const r=await api('/api/admin/config',{method:'PUT',body:JSON.stringify({key:k,value:v})}); save.textContent=r.ok?'Saved ✓':'Failed'; setTimeout(()=>save.textContent='Save',1400); }
    if(test){ const k=test.dataset.k,v=$('settings').querySelector('.cfgfield[data-k="'+k+'"]').value; test.textContent='Testing…'; const d2=await (await api('/api/admin/config/test',{method:'POST',body:JSON.stringify({key:k,value:v})})).json(); $('cfgMsg').className='msg '+(d2.ok?'ok':'err'); $('cfgMsg').textContent=(d2.ok?'✓ ':'✗ ')+d2.message; test.textContent='Test'; } });
  $('reloadCfg').onclick=async()=>{ await api('/api/admin/config/reload',{method:'POST'}); $('cfgMsg').className='msg ok'; $('cfgMsg').textContent='Reloaded into the running app.'; };
}
boot();
</script>
