name: elavofishai

# ElavoFishAI runs alongside AlphaGasIQ on the Mac Mini. AlphaGasIQ owns :3000/:8000;
# this app owns :3100. Postgres is internal-only (not published) so it never clashes.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: elavofish
      POSTGRES_PASSWORD: ${PG_PASSWORD:-elavofish}
      POSTGRES_DB: elavofish
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elavofish']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3100
      HOST: 0.0.0.0
      DATABASE_URL: postgres://elavofish:${PG_PASSWORD:-elavofish}@postgres:5432/elavofish
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Off by default: on, it lets any caller sign in as any email.
      DEV_SHOW_MAGIC_LINK: ${DEV_SHOW_MAGIC_LINK:-0}
      ALLOW_INSECURE_DEV_LOGIN: ${ALLOW_INSECURE_DEV_LOGIN:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_PROFILE_MODEL: ${AI_PROFILE_MODEL:-claude-opus-4-8}
      # Admin Command Center (bootstrap) + config encryption
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      # Shared with the host upgrade agent (scripts/upgrade-agent.sh). The admin
      # "Upgrade from Git" button writes a trigger file here and tails
      # status.log; the container never runs git or docker itself. Without this
      # mount the Upgrade tab reports "not configured".
      - ${DEPLOY_DIR:-./deploy}:/deploy
    ports:
      - '3100:3100'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
